[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindb"
version = "0.3.0"
description = "Import Kindle library JSON and optional official Kindle.zip metadata into DuckDB"
requires-python = ">=3.10"
dependencies = [
    # 1.1 以前は同じトランザクションで DELETE したキーを INSERT すると主キー違反になり、取り込み直しが失敗する
    "duckdb>=1.2",
    "typer>=0.12",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
kindb = "kindb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kindb"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
