[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kindb"
version = "0.1.0"
description = "Import official Kindle.zip into DuckDB for local search and analysis"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
kindb = "kindb.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
