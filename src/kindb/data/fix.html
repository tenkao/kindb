<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kindb-token" content="__KINDB_TOKEN__">
<title>kindb 手動訂正</title>
<!-- 指定がないとブラウザが /favicon.ico を取りに来て、-v の端末に 404 の行が出る -->
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f1;
  --surface: #fcfcfa;
  --surface-2: #eceee8;
  --ink: #1b2230;
  --muted: #5a6474;
  --line: #d6dbd9;
  --accent: #1d6f63;
  --accent-ink: #fcfcfa;
  --accent-soft: #d9ebe6;
  --good: #2a7036;
  --good-soft: #dcecd9;
  --warn: #7f570b;
  --warn-soft: #f3e6c8;
  --bad: #a53a27;
  --bad-soft: #f5dcd4;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #10151c;
    --surface: #171e27;
    --surface-2: #1e2732;
    --ink: #e4e8ee;
    --muted: #9aa3b4;
    --line: #2c3542;
    --accent: #5cc2ae;
    --accent-ink: #10151c;
    --accent-soft: #173a35;
    --good: #7fcb8a;
    --good-soft: #1d3322;
    --warn: #e2b45c;
    --warn-soft: #3a2f16;
    --bad: #f08a73;
    --bad-soft: #3d211b;
  }
}
* { box-sizing: border-box; }
/* display を指定した要素でも hidden 属性で隠れるようにする */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 14px; line-height: 1.6;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 0.92em; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100%; }
.app > header.bar { grid-row: 1; }
.app > #banner { grid-row: 2; }
.app > main { grid-row: 3; }
.app > footer.tray { grid-row: 4; }

header.bar {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px;
  padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
}
header.bar h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
header.bar .paths { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); min-width: 0; }
header.bar .paths span { overflow-wrap: anywhere; }
.notice {
  margin: 0; padding: 8px 20px; font-size: 13px;
  background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--line);
}
.error-banner { background: var(--bad-soft); color: var(--bad); }

main { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; min-height: 0; }

/* 一覧 */
.list-pane { display: grid; grid-template-rows: auto auto 1fr; border-right: 1px solid var(--line); min-height: 0; }
.filters { display: flex; gap: 6px; padding: 12px 16px 8px; }
.tab {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 13px;
  color: var(--muted);
}
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { padding: 0 16px 10px; display: grid; gap: 4px; }
.search input {
  width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
}
.search .count { font-size: 12px; color: var(--muted); }
.books { list-style: none; margin: 0; padding: 0 8px 16px; overflow-y: auto; }
.book-item {
  display: grid; gap: 3px; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px;
  background: transparent;
}
.book-item:hover { background: var(--surface-2); }
.book-item[aria-current="true"] { background: var(--accent-soft); }
.book-item .t { font-size: 13.5px; overflow-wrap: anywhere; }
.book-item .meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

.chip {
  display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 4px; line-height: 1.7;
  background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }

/* 詳細 */
.detail-pane { overflow-y: auto; padding: 20px 24px 32px; min-height: 0; }
.placeholder { color: var(--muted); margin-top: 40px; text-align: center; }
.book-head { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; }
.book-head img { width: 72px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface-2); }
.book-head h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.45; text-wrap: balance; overflow-wrap: anywhere; }
/* 次にすること: 本を選んで最初に読む指示なので、書誌の欄より目立たせる */
.next {
  margin: 10px 0 0; padding: 8px 12px; max-width: 70ch; font-size: 13.5px; font-weight: 600;
  border-left: 3px solid var(--accent); border-radius: 4px; background: var(--accent-soft); color: var(--ink);
}
.next code {
  padding: 0 4px; border-radius: 3px; background: var(--surface); font-weight: 400; overflow-wrap: anywhere;
}
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 10px 0 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts a { color: var(--accent); }

section.block { margin-top: 24px; display: grid; gap: 10px; }
section.block h3 { margin: 0; font-size: 14px; }
section.block p { margin: 0; max-width: 70ch; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.matched td { background: var(--accent-soft); }
tr.pending-row td { background: var(--warn-soft); }
td a { color: var(--accent); }
td.nowrap { white-space: nowrap; }

.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 6px; padding: 4px 12px; font-size: 13px; white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }

.isbn-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.isbn-form input {
  width: 18ch; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  font-family: var(--mono);
}
.isbn-form input[aria-invalid="true"] { border-color: var(--bad); }
.exclude-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hint { font-size: 12.5px; color: var(--muted); }
.hint.bad { color: var(--bad); }
.override-box {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px;
  border: 1px solid var(--warn); border-radius: 8px; background: var(--warn-soft); color: var(--warn);
}

/* 反映待ち */
footer.tray {
  border-top: 1px solid var(--line); background: var(--surface); padding: 12px 20px;
  display: grid; gap: 8px; max-height: 45vh; overflow-y: auto;
}
.tray-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.tray-head h2 { margin: 0; font-size: 14px; }
.staged { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.staged li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; font-size: 13px; }
.staged li .t { overflow-wrap: anywhere; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 6px; }
.results { display: grid; gap: 4px; font-size: 13px; }
.results .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.busy { color: var(--accent); font-size: 13px; }

@media (max-width: 800px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 40vh) auto; }
  .list-pane { border-right: 0; border-bottom: 1px solid var(--line); }
  .detail-pane { padding: 16px; }
  header.bar, footer.tray, .notice { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>kindb 手動訂正</h1>
    <div class="paths">
      <span>DB: <span class="mono" id="db-path">…</span></span>
      <span>訂正の CSV: <span class="mono" id="csv-path">…</span></span>
    </div>
  </header>
  <p class="notice error-banner" id="banner" role="alert" hidden></p>

  <main>
    <div class="list-pane">
      <div class="filters" role="group" aria-label="表示する本">
        <button type="button" class="tab" id="view-review" aria-pressed="true">要確認</button>
        <button type="button" class="tab" id="view-corrected" aria-pressed="false">訂正済み</button>
        <button type="button" class="tab" id="view-all" aria-pressed="false">すべて</button>
      </div>
      <div class="search">
        <input type="search" id="q" placeholder="書名、著者、ASIN で絞り込み" aria-label="書名、著者、ASIN で絞り込み">
        <span class="count" id="count"></span>
      </div>
      <ul class="books" id="books" aria-label="本の一覧"></ul>
    </div>
    <div class="detail-pane" id="detail">
      <p class="placeholder">左の一覧から本を選んでください。</p>
    </div>
  </main>

  <footer class="tray" id="tray" hidden>
    <div class="tray-head">
      <h2 id="tray-title">反映待ち</h2>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span class="busy" id="busy" role="status" hidden></span>
        <button type="button" class="btn" id="apply">反映する</button>
      </div>
    </div>
    <p class="hint" id="tray-summary"></p>
    <ul class="staged" id="staged"></ul>
    <div class="results" id="results" role="status" hidden></div>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var TOKEN = document.querySelector('meta[name="kindb-token"]').content;
  // 状態の区分(サーバの label_of が決める)ごとの表示名と色
  var LABELS = {
    unfetched: ["未取得", ""],
    edition: ["紙版を特定", "good"],
    work: ["作品のみ特定", "warn"],
    isbn: ["ISBN で特定", "accent"],
    unmatched: ["照合なし", "warn"],
    not_found: ["見つからない", "bad"],
    not_in_ndl: ["NDL なし", ""],
    incomplete: ["保留", "warn"],
    excluded: ["除外", ""],
    error: ["取得失敗", "bad"]
  };
  var VIEWS = ["review", "corrected", "all"];

  var state = {
    view: "review",
    q: "",
    selected: null,
    detail: null,
    overrides: {},
    pending: [],
    staged: {},   // asin -> {isbn: string|null, title: string}
    busy: false
  };

  // --- 通信 ---
  function api(path, options) {
    options = options || {};
    var headers = { "X-Kindb-Token": TOKEN };
    if (options.body) headers["Content-Type"] = "application/json";
    return fetch(path, { method: options.method || "GET", headers: headers, body: options.body })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
          return data;
        });
      });
  }

  // --- 部品 ---
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }
  function chip(label, kind) { return el("span", { class: "chip " + (kind || ""), text: label }); }

  function labelText(key) { return (LABELS[key] || [key])[0]; }

  function statusChips(book) {
    var l = LABELS[book.label] || [book.label, ""];
    var chips = [chip(l[0], l[1])];
    // 画面でためた変更と、CSV に手で書いた未反映の訂正は、どちらも反映すると変わるので同じ印にする
    if (state.staged[book.asin] || book.pending) chips.push(chip("反映待ち", "accent"));
    return chips;
  }

  // 詳細の見出しの下に出す、次にすること。コマンドは、この本だけを引く形で示す(--where なしだと未取得の本をすべて引くため)
  function nextStep(book) {
    function cmd(args) {
      return el("code", { class: "mono", text: "kindb enrich " + args + "--where \"asin = '" + book.asin + "'\"" });
    }
    switch (book.label) {
      case "unfetched": return ["端末で ", cmd(""), " を実行すると取得します。"];
      case "work": return ["作品は特定できましたが、紙版は定まっていません。下の候補から紙版を選ぶと特定できます。"];
      case "unmatched": return ["照合の規則を更新した結果、どの候補にも照合していません。下の候補から紙版を選ぶか、端末で ",
                                cmd("--refresh "), " を実行して再取得してください。"];
      case "not_found": return ["紙版の ISBN が分かれば、下の欄に入力して訂正してください。"];
      case "not_in_ndl": return ["指定した ISBN の紙版は NDL サーチにありません。ISBN が正しければ、このままで構いません。"];
      case "incomplete": return ["検索結果が多すぎて確かめきれませんでした。再取得しても同じ結果になりやすいので、"
                                 + "紙版の ISBN を下の欄に入力して訂正してください。"];
      case "error": return ["NDL サーチから取得できませんでした。端末で ", cmd(""), " を実行すると再取得します。"];
      default: return null;
    }
  }

  function showBanner(message) {
    var banner = document.getElementById("banner");
    banner.textContent = message || "";
    banner.hidden = !message;
  }

  // --- ISBN の検査数字(サーバでも同じ検査をする) ---
  function isbnDigits(raw) { return raw.normalize("NFKC").replace(/[^0-9Xx]/g, "").toUpperCase(); }
  function isbnShapeOk(raw) { return /^(\d{13}|\d{9}[\dX])$/.test(isbnDigits(raw)); }
  function isbnValid(raw) {
    var s = isbnDigits(raw), i, sum = 0;
    if (/^\d{13}$/.test(s)) {
      for (i = 0; i < 12; i++) sum += Number(s[i]) * (i % 2 ? 3 : 1);
      return (10 - (sum % 10)) % 10 === Number(s[12]);
    }
    if (/^\d{9}[\dX]$/.test(s)) {
      for (i = 0; i < 9; i++) sum += Number(s[i]) * (10 - i);
      var check = (11 - (sum % 11)) % 11;
      return (check === 10 ? "X" : String(check)) === s[9];
    }
    return false;
  }
  function isbn13(raw) {
    var s = isbnDigits(raw);
    if (s.length === 13) return s;
    var core = "978" + s.slice(0, 9), sum = 0;
    for (var i = 0; i < 12; i++) sum += Number(core[i]) * (i % 2 ? 3 : 1);
    return core + String((10 - (sum % 10)) % 10);
  }

  // --- 状態 ---
  function loadState() {
    return api("/api/state").then(function (data) {
      state.overrides = data.overrides;
      state.pending = data.pending;
      document.getElementById("db-path").textContent = data.db;
      document.getElementById("csv-path").textContent =
        data.overrides_path + (data.overrides_exists ? "" : "(未作成。反映すると作成します)");
      renderTray();
    });
  }

  // --- 一覧 ---
  var searchTimer = null;
  var listSeq = 0;
  function loadBooks() {
    // 画面でためた変更はサーバが知らないので、要確認に足すよう ASIN を送る
    var params = new URLSearchParams({ view: state.view, q: state.q, staged: Object.keys(state.staged).join(",") });
    var seq = ++listSeq;
    return api("/api/books?" + params).then(function (data) {
      if (seq !== listSeq) return;  // あとから送った要求の応答を、先に送った要求の応答で上書きしない
      var list = document.getElementById("books");
      var focused = document.activeElement && document.activeElement.dataset
        ? document.activeElement.dataset.asin : null;
      list.replaceChildren();
      data.books.forEach(function (book) {
        var item = el("button", {
          type: "button", class: "book-item", "data-asin": book.asin,
          "aria-current": book.asin === state.selected ? "true" : "false",
          onclick: function () { selectBook(book.asin); }
        }, [
          el("span", { class: "t", text: book.title }),
          el("span", { class: "meta" }, statusChips(book).concat([
            el("span", { class: "mono muted", text: book.asin })
          ]))
        ]);
        list.appendChild(el("li", {}, [item]));
        if (book.asin === focused) item.focus();
      });
      var shown = data.books.length;
      document.getElementById("count").textContent =
        shown < data.total ? data.total + " 冊中 " + shown + " 冊を表示しています。書名などで絞り込んでください" : data.total + " 冊";
      showBanner(null);
    }).catch(function (e) { showBanner(e.message); });
  }

  function setView(view) {
    state.view = view;
    VIEWS.forEach(function (v) {
      document.getElementById("view-" + v).setAttribute("aria-pressed", String(view === v));
    });
    loadBooks();
  }

  // --- 詳細 ---
  var detailSeq = 0;
  function selectBook(asin) {
    var seq = ++detailSeq;
    return api("/api/books/" + encodeURIComponent(asin)).then(function (data) {
      if (seq !== detailSeq) return;
      var changed = state.selected !== asin;
      state.selected = asin;
      state.detail = data;
      renderDetail();
      // 別の本に移ったら先頭から見せる。前の本の候補の表を下まで見たあとだと、書名が画面の外に隠れるため
      if (changed) document.getElementById("detail").scrollTop = 0;
      loadBooks();
      showBanner(null);
    }).catch(function (e) { showBanner(e.message); });
  }

  // 反映中は反映待ちを変えない。反映が終わると送った分を反映待ちから消すので、途中の変更が黙って消えるため
  function stage(asin, isbn, title) {
    if (state.busy) return;
    state.staged[asin] = { isbn: isbn, title: title };
    renderTray();
    renderDetail();
    loadBooks();
    focusById("staged-cancel");
  }
  function unstage(asin) {
    if (state.busy) return;
    var prev = state.staged[asin];
    delete state.staged[asin];
    renderTray();
    renderDetail();
    loadBooks();
    // 取り消した操作をした場所にフォーカスを戻す(候補の行の「選択」、ISBN 欄、訂正の取り消しボタン)
    if (!prev || prev.isbn === null) { focusById("override-remove"); return; }
    if (prev.isbn === "") { focusById("exclude-btn"); return; }
    var pick = document.querySelector('[data-pick-isbn="' + prev.isbn + '"]');
    if (pick) pick.focus(); else focusById("isbn-input");
  }
  function focusById(id) {
    var node = document.getElementById(id);
    if (node) node.focus();
  }

  function renderDetail() {
    var pane = document.getElementById("detail");
    pane.replaceChildren();
    if (!state.detail) {
      pane.appendChild(el("p", { class: "placeholder", text: "左の一覧から本を選んでください。" }));
      return;
    }
    var book = state.detail.book, cands = state.detail.candidates, next = nextStep(book);
    var facts = el("dl", { class: "facts" });
    function fact(label, value, mono) {
      if (value === null || value === undefined || value === "") return;
      facts.appendChild(el("dt", { text: label }));
      facts.appendChild(el("dd", { class: mono ? "mono" : "", text: String(value) }));
    }
    fact("ASIN", book.asin, true);
    var amazon = "https://www.amazon.co.jp/dp/" + encodeURIComponent(book.asin);
    facts.appendChild(el("dt", { text: "Amazon" }));
    facts.appendChild(el("dd", {}, [
      el("a", { href: amazon, target: "_blank", rel: "noopener noreferrer", text: amazon })
    ]));
    fact("著者", book.authors);
    fact("シリーズ", book.series_title);
    fact("取得日", book.acquired_at ? book.acquired_at.slice(0, 10) : null);
    fact("ISBN", book.isbn, true);
    fact("刊行年月", book.paper_issued);
    fact("出版社", book.publisher);
    fact("NDC", book.ndc ? book.ndc + (book.ndc_label ? " " + book.ndc_label : "") : null);

    pane.appendChild(el("div", { class: "book-head" }, [
      book.image ? el("img", { src: book.image, alt: "", referrerpolicy: "no-referrer", loading: "lazy" })
                 : el("span"),
      el("div", {}, [
        el("h2", { id: "detail-title", tabindex: "-1", text: book.title }),
        el("div", { class: "meta", style: "display:flex;gap:4px;flex-wrap:wrap" }, statusChips(book)),
        next ? el("p", { class: "next" }, next) : null,
        facts
      ])
    ]));

    var staged = state.staged[book.asin];
    function cancelButton() {
      return el("button", {
        type: "button", class: "btn ghost", id: "staged-cancel", text: "キャンセル",
        disabled: state.busy ? "disabled" : null, onclick: function () { unstage(book.asin); }
      });
    }
    // 上の枠は登録済みの訂正(本の今の状態)だけに使う。反映待ちは、操作した場所の近くに出す
    if (book.override && staged && staged.isbn === null) {
      pane.appendChild(el("div", { class: "override-box", style: "margin-top:16px" }, [
        el("span", { text: "反映待ち: 訂正の取り消し" }), cancelButton()
      ]));
    } else if (book.override) {
      pane.appendChild(el("div", { class: "override-box", style: "margin-top:16px" }, [
        el("span", {
          text: book.override.excluded ? "手動訂正で照合の対象から除外しています"
                                       : "手動訂正で ISBN " + book.override.isbn + " を指定しています"
        }),
        el("button", {
          type: "button", class: "btn danger", id: "override-remove", text: "訂正を取り消す",
          disabled: state.busy ? "disabled" : null,
          title: "CSV から行を削除し、書名で検索し直します",
          onclick: function () { stage(book.asin, null, book.title); }
        })
      ]));
    }

    // 候補
    var candBlock = el("section", { class: "block" }, [el("h3", { text: "保存済みの候補(" + cands.length + " 件)" })]);
    if (!cands.length) {
      candBlock.appendChild(el("p", {
        class: "hint",
        text: ["not_found", "not_in_ndl", "incomplete"].indexOf(book.label) >= 0
          ? "見つからなかった本は候補を保存していません。"
          : "候補はありません。"
      }));
    } else {
      var tbody = el("tbody");
      cands.forEach(function (c) {
        var pick;
        var stagedHere = staged && staged.isbn && c.isbns.some(function (x) { return x.isbn === staged.isbn; });
        if (!c.isbns.length) {
          pick = el("span", { class: "hint", text: "ISBN なし" });
        } else {
          pick = el("div", { style: "display:grid;gap:4px" }, c.isbns.map(function (x) {
            if (!x.valid) return el("span", { class: "hint bad", text: "ISBN が不正" });
            if (staged && staged.isbn === x.isbn) return cancelButton();
            return el("button", {
              type: "button", class: "btn ghost", "data-pick-isbn": x.isbn,
              text: c.isbns.length > 1 ? "選択 " + x.isbn : "選択",
              "aria-label": c.title + "(ISBN " + x.isbn + ")を選択",
              disabled: state.busy ? "disabled" : null,
              onclick: function () { stage(book.asin, x.isbn, book.title); }
            });
          }));
        }
        var titleCell = el("td", {}, [
          el("a", { href: c.link, target: "_blank", rel: "noopener noreferrer", text: c.title }),
          c.matched ? el("div", {}, [chip("現在の照合", "accent")]) : null,
          stagedHere ? el("div", {}, [chip("反映待ち", "warn")]) : null
        ]);
        tbody.appendChild(el("tr", { class: stagedHere ? "pending-row" : c.matched ? "matched" : "" }, [
          titleCell,
          el("td", { class: "nowrap", text: c.volume || "" }),
          el("td", { text: c.edition || "" }),
          el("td", { text: c.series.join(" / ") }),
          el("td", { text: c.publishers.join(", ") }),
          el("td", { class: "nowrap mono", text: c.issued || "" }),
          el("td", { class: "nowrap", text: c.extent || "" }),
          el("td", { class: "nowrap mono", text: c.isbns.map(function (x) { return x.isbn; }).join("\n") }),
          el("td", {}, [pick])
        ]));
      });
      candBlock.appendChild(el("p", { class: "hint", text: "書名を押すと NDL サーチの書誌を別のタブで開きます。" }));
      var head = el("tr", {}, ["書名", "巻", "版", "シリーズ", "出版社", "刊行年月", "ページ数", "ISBN", ""].map(function (h) {
        return el("th", { text: h });
      }));
      candBlock.appendChild(el("div", { class: "table-wrap" }, [
        el("table", {}, [el("thead", {}, [head]), tbody])
      ]));
    }

    // ISBN の直接入力。候補の表より上に置く。候補が多いと表の下まで送るのが手間で、Amazon の商品ページで紙版の
    // ISBN を調べて入力するのが主な使い方になるため
    var input = el("input", {
      id: "isbn-input", inputmode: "numeric", autocomplete: "off", placeholder: "978…",
      "aria-labelledby": "isbn-heading", "aria-describedby": "isbn-hint"
    });
    var hint = el("span", { class: "hint", id: "isbn-hint", text: "ISBN-13 または ISBN-10(ハイフンの有無は問いません)" });
    var add = el("button", { type: "button", class: "btn", text: "この ISBN を指定", disabled: "disabled" });
    input.addEventListener("input", function () {
      var v = input.value.trim();
      var ok = v !== "" && isbnValid(v);
      input.setAttribute("aria-invalid", v !== "" && !ok ? "true" : "false");
      hint.className = v !== "" && !ok ? "hint bad" : "hint";
      hint.textContent = v === "" ? "ISBN-13 または ISBN-10(ハイフンの有無は問いません)"
        : ok ? "有効な ISBN です"
        : !isbnShapeOk(v) ? "13 桁または 10 桁で入力してください"
        : "チェックデジットが一致しません。入力内容を確認してください";
      if (ok && !state.busy) add.removeAttribute("disabled"); else add.setAttribute("disabled", "disabled");
    });
    function submit() {
      if (!isbnValid(input.value.trim())) return;
      stage(book.asin, isbn13(input.value.trim()), book.title);
    }
    add.addEventListener("click", submit);
    input.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      // 反映待ちに入れるとフォーカスが「キャンセル」に移る。既定の動作を止めないと、同じ Enter でそのボタンも押される
      e.preventDefault();
      submit();
    });
    // 候補にない ISBN の反映待ちは、入力欄のすぐ下に出す
    var inCandidates = staged && staged.isbn && cands.some(function (c) {
      return c.isbns.some(function (x) { return x.isbn === staged.isbn; });
    });
    var typed = staged && staged.isbn && !inCandidates
      ? el("div", { class: "override-box" }, [el("span", { text: "反映待ち: ISBN " + staged.isbn + " を指定" }), cancelButton()])
      : null;
    // 紙版なしは ISBN の入力欄より上に置く。見つからない本の多くは Kindle だけの作品で、先に判断できるため
    var exclude = excludeRow(book, staged, cancelButton);
    if (exclude) pane.appendChild(el("section", { class: "block" }, [exclude]));
    pane.appendChild(el("section", { class: "block" }, [
      el("h3", { id: "isbn-heading", text: "ISBN を入力" }),
      el("p", { class: "hint", text: "ISBN を入力して指定します。反映時に入力した ISBN で NDL サーチを検索します。" }),
      el("div", { class: "isbn-form" }, [input, add, hint]),
      typed
    ]));
    pane.appendChild(candBlock);
  }

  // 紙版のない本(Kindle だけの作品など)を除外にする。除外済みの本は上の枠の「訂正を取り消す」で戻す
  function excludeRow(book, staged, cancelButton) {
    if (book.override && book.override.excluded) return null;
    if (staged && staged.isbn === "") {
      return el("div", { class: "override-box" }, [el("span", { text: "反映待ち: 紙版なし(照合しない)" }), cancelButton()]);
    }
    return el("div", { class: "exclude-row" }, [
      el("button", {
        type: "button", class: "btn ghost", id: "exclude-btn", text: "紙版なし(照合しない)",
        disabled: state.busy ? "disabled" : null,
        onclick: function () { stage(book.asin, "", book.title); }
      }),
      el("span", { class: "hint", text: "Kindle だけの作品など紙版がない本は照合の対象から外します。要確認に出なくなり以後の取得でも問い合わせません。" })
    ]);
  }

  // --- 反映待ち ---
  function renderTray() {
    var tray = document.getElementById("tray");
    var asins = Object.keys(state.staged);
    var extra = state.pending.filter(function (a) { return !state.staged[a]; });
    var resultsShown = !document.getElementById("results").hidden;
    tray.hidden = !asins.length && !extra.length && !resultsShown;
    var list = document.getElementById("staged");
    list.replaceChildren();
    asins.forEach(function (asin) {
      var s = state.staged[asin];
      list.appendChild(el("li", {}, [
        el("span", { class: "t", text: s.title }),
        el("span", { class: "mono", text: s.isbn ? "ISBN " + s.isbn : s.isbn === "" ? "紙版なし" : "訂正の取り消し" }),
        el("button", {
          type: "button", class: "x", "aria-label": s.title + " の変更をキャンセル", text: "×",
          onclick: function () { unstage(asin); }
        })
      ]));
    });
    var byIsbn = asins.filter(function (a) { return state.staged[a].isbn; }).length;
    var exclusions = asins.filter(function (a) { return state.staged[a].isbn === ""; }).length;
    var removals = asins.length - byIsbn - exclusions;
    var parts = [];
    if (byIsbn) parts.push("ISBN の指定: " + byIsbn + " 冊(NDL サーチへの問い合わせ " + byIsbn + " 回)");
    if (exclusions) parts.push("紙版なし: " + exclusions + " 冊(問い合わせなし)");
    if (removals) parts.push("訂正の取り消し: " + removals + " 冊(書名で再検索。1 冊あたり最大 6 回)");
    if (extra.length) parts.push("CSV で直接編集した未反映の訂正 " + extra.length + " 冊も合わせて反映します");
    document.getElementById("tray-title").textContent = asins.length ? "反映待ち " + asins.length + " 冊" : "反映待ち";
    document.getElementById("tray-summary").textContent = parts.length
      ? parts.join("。") + "。" + (byIsbn || removals || extra.length ? "問い合わせは 3 秒以上の間隔で送ります。" : "") : "";
    document.getElementById("apply").disabled = state.busy || (!asins.length && !extra.length);
  }

  function statusLabel(r) {
    return labelText(r.label) + (r.isbn ? " " + r.isbn : "") + (r.error ? "(" + r.error + ")" : "");
  }

  function apply() {
    var asins = Object.keys(state.staged);
    var changes = {};
    asins.forEach(function (a) { changes[a] = state.staged[a].isbn; });
    var requests = asins.filter(function (a) { return state.staged[a].isbn !== ""; }).length + state.pending.length;
    state.busy = true;
    renderTray();
    var busy = document.getElementById("busy");
    busy.hidden = false;
    busy.textContent = requests
      ? "NDL サーチに問い合わせ中です(" + requests + " 冊、" + (requests * 3) + " 秒以上かかります)…"
      : "反映しています…";
    showBanner(null);
    api("/api/apply", { method: "POST", body: JSON.stringify({ changes: changes }) })
      .then(function (data) {
        asins.forEach(function (a) {
          if (state.staged[a] && state.staged[a].isbn === changes[a]) delete state.staged[a];
        });
        var box = document.getElementById("results");
        box.replaceChildren();
        box.hidden = false;
        var head = data.changed.length
          ? "反映しました(再取得 " + data.fetched + " 冊" + (data.excluded.length ? "、除外 " + data.excluded.length + " 冊" : "") + ")"
          : "CSV を保存しました。DB はすでに同じ内容のため、再取得はありません";
        box.appendChild(el("div", { class: "row" }, [
          el("strong", { text: head }),
          el("button", {
            type: "button", class: "btn ghost", text: "閉じる",
            onclick: function () { box.hidden = true; renderTray(); }
          })
        ]));
        data.results.concat(data.excluded).forEach(function (r) {
          box.appendChild(el("div", { class: "row" }, [
            el("span", { text: r.title }),
            el("span", { class: "mono", text: statusLabel(r) })
          ]));
        });
        if (data.failed) {
          box.appendChild(el("p", {
            class: "hint bad",
            text: data.failed + " 冊は NDL サーチから取得できませんでした。端末で kindb enrich を実行すると再取得します。"
          }));
        }
        if (data.aborted || data.interrupted) {
          box.appendChild(el("p", {
            class: "hint bad",
            text: "処理が途中で止まりました。残りの本は、端末で kindb enrich を実行すると再取得します。"
          }));
        }
      })
      .catch(function (e) { showBanner("反映できませんでした: " + e.message); })
      .then(function () {
        state.busy = false;
        busy.hidden = true;
        renderTray();
        return loadState();
      })
      .then(function () {
        loadBooks();
        if (state.selected) selectBook(state.selected);
      })
      .catch(function (e) { showBanner(e.message); });
  }

  // --- 起動 ---
  VIEWS.forEach(function (v) {
    document.getElementById("view-" + v).addEventListener("click", function () { setView(v); });
  });
  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadBooks, 250);
  });
  // 一覧の本にフォーカスがあるときだけ、上下のキーで前後の本を選ぶ。詳細や検索欄では、スクロールや入力の
  // 既定の動作を残す。続けて押したときは selectBook の detailSeq で最後の本の詳細だけを出す
  document.getElementById("books").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var current = e.target.closest(".book-item");
    if (!current) return;
    e.preventDefault();
    var items = Array.prototype.slice.call(document.querySelectorAll("#books .book-item"));
    var next = items[items.indexOf(current) + (e.key === "ArrowDown" ? 1 : -1)];
    if (!next) return;
    next.focus();
    selectBook(next.dataset.asin);
  });
  document.getElementById("apply").addEventListener("click", apply);
  window.addEventListener("beforeunload", function (e) {
    if (Object.keys(state.staged).length) { e.preventDefault(); e.returnValue = ""; }
  });

  loadState().then(loadBooks).catch(function (e) { showBanner(e.message); });
})();
</script>
</body>
</html>
